name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint protobuf contracts
        run: npm run buf:lint

      - name: Generate gRPC TypeScript
        run: npm run buf:generate

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Linter
        run: npm run lint

      - name: Check architecture dependencies
        run: npm run dep:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build project
        run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run integration tests in Docker
        run: npm run test:integration

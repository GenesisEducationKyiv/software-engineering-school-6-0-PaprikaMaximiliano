syntax = "proto3";

package scanner.v1;

service ScannerAccessService {
  rpc ListScanTargets (ListScanTargetsRequest) returns (ListScanTargetsResponse);
  rpc UpdateLastSeenTag (UpdateLastSeenTagRequest) returns (UpdateLastSeenTagResponse);
}

message ListScanTargetsRequest {}

message ListScanTargetsResponse {
  repeated ScanTarget targets = 1;
}

message ScanTarget {
  string id = 1;
  string full_name = 2;
  optional string last_seen_tag = 3;
  repeated ScanSubscriber subscribers = 4;
}

message ScanSubscriber {
  string email = 1;
  string unsubscribe_url = 2;
}

message UpdateLastSeenTagRequest {
  string repository_id = 1;
  optional string previous_last_seen_tag = 2;
  string new_last_seen_tag = 3;
}

message UpdateLastSeenTagResponse {}
